# Configuração da análise de covered calls.
# Rode com: options --config config.toml   (ou)   python3 t1.py

# --- universo ---
lista_ativos = ["IBIT", "AAPL", "IVV", "NVDA", "SPY", "META",
                "AMZN", "GOOGL", "TSLA", "MSFT", "TFLO", "AGG",
                "USFR", "REMX", "NU", "TSM", "GLD", "AVEM",
                "VPL", "BBEU", "AVGO", "MU", "LLY"]
top_n = 5

# --- risco / mercado ---
prob_exerc_max   = 0.15
taxa_livre_risco = 0.045
# dividend_yield: valor único para todos os ativos (abaixo) OU por ativo,
# usando a tabela [dividend_yield] no fim deste arquivo.
dividend_yield   = 0.00

# --- modelos de probabilidade ---
usar_prob_d2       = true
usar_prob_empirica = true
periodo_historico  = "5y"
min_amostras_empirica = 30

# --- prêmio / convenção ---
usar_premio = "bid"   # bid | ask | lastPrice | mid
dias_ano    = 365
min_dias    = 7
max_dias    = 20

# --- filtro de strike ---
# 0.0 = apenas OTM (padrão). Valores negativos permitem ITM, ex.: -0.05 = até 5% ITM.
min_distancia_strike_pct = 0.0

# --- filtros de retorno/lucro ---
# Limiares mínimos (estritos) do ranking. 0.0 preserva o comportamento padrão
# (exige retorno e lucro positivos); valores negativos relaxam o filtro, ex.:
# min_lucro_se_exercido = -0.01 aceita exercício com prejuízo de até 1 centavo/ação.
min_retorno_anualizado_liquido = 0.0
min_lucro_se_exercido          = 0.0

# --- filtro de liquidez ---
# Limiares de liquidez. Não descartam mais a opção: viram a flag passou_liquidez,
# usada como condição do ranking e exibida na matriz completa (coluna status).
liquidez_volume_min        = 100
liquidez_open_interest_min = 500
liquidez_spread_max        = 0.15

# --- custos (USD por contrato) ---
tamanho_contrato = 100
custo_compra     = 0.00
custo_venda      = 0.00
# Custo de exercício (atribuição) por contrato = max(pct * valor de venda,
# mínimo) + taxa fixa. valor de venda = strike * tamanho_contrato.
# Default: 0,25% do valor de venda ou US$ 10 (o que for maior).
custo_exercicio_pct = 0.0025
custo_exercicio_min = 10.00
custo_exercicio     = 0.00   # taxa fixa adicional por contrato (opcional)

# --- chains históricas (subcomandos baixar-chains / backtest-chains) ---
# Pasta do store local de snapshots EOD ({ativo}/{YYYY-MM-DD}.parquet),
# alimentado por 'allocation baixar-chains' (Theta Data) e consumido pelo
# replay do screener ('allocation backtest-chains').
# pasta_chains = "chains_historicas"

# --- dados ---
modo_offline   = false
salvar_mock    = false
pasta_mock     = "base_mock"
usar_cache     = true
cache_ttl_horas = 6.0
pasta_cache    = ".cache"

# --- saída ---
arquivo_excel = "top_opcoes_covered_call.xlsx"
# matriz completa de candidatas (todas as opções, com coluna de status)
arquivo_matriz = "matriz_opcoes.xlsx"

# Preço médio de aquisição (opcional, apenas para gráfico de payoff). Quando informado, a operação é classificada
# como "covered_call" e o retorno_sobre_custo reflete o custo real da posição;
# contratos com strike abaixo do custo recebem alerta_abaixo_custo = true.
# Sem este campo, a operação é "buy_write" (capital = preço de mercado).
# Exemplo:
# [preco_medio_aquisicao]
# IBIT = 55.00
# AAPL = 180.00

# Dividend yield por ativo (opcional). Se presente, sobrescreve o valor único
# acima e deixa de usá-lo. Ativos não listados assumem 0.0.
# [dividend_yield]
# AAPL = 0.005
# SPY  = 0.013

# Grade de parâmetros do 'backtest-chains --grid' (campo da Config -> lista de
# valores a combinar). Sem esta tabela, usa-se uma grade default de
# prob_exerc_max x max_dias. Tabelas TOML devem ficar no fim do arquivo.
# [grade_validacao]
# prob_exerc_max = [0.10, 0.15, 0.25]
# max_dias       = [20, 30, 45]
